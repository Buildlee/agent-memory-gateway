name: 验证

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Windows Python ${{ matrix.python-version }} 回归检查
    runs-on: windows-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装测试依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp,postgres,dev]"

      - name: 运行自动化测试
        shell: pwsh
        run: python -m unittest discover -s tests

      - name: 编译与 PowerShell 语法检查
        shell: pwsh
        run: |
          python -m compileall -q src tests
          $errors = @()
          Get-ChildItem -LiteralPath scripts -Filter '*.ps1' -File | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            $errors += $parseErrors
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: 检查公开文件是否包含敏感信息
        shell: pwsh
        run: .\scripts\check-public-sensitive.ps1

      - name: 检查补丁格式
        shell: pwsh
        run: git diff-tree --check -r HEAD

  package:
    name: 构建并验证 wheel
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建 wheel
        run: |
          python -m pip install --upgrade pip build
          python scripts/build-wheel.py --outdir dist

      - name: 从 wheel 安装并验证入口
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install --upgrade pip
          wheel_path="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          wheel-smoke/bin/python -m pip install "$wheel_path[mcp,postgres]"
          wheel-smoke/bin/memory-device --help
          wheel-smoke/bin/memory-device paths --platform linux
          wheel-smoke/bin/memory-gateway --help
          wheel-smoke/bin/memory-import --help

  cross-platform:
    name: ${{ matrix.os }} Python ${{ matrix.python-version }} 回归检查
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp,postgres,dev]"

      - name: 运行自动化测试
        run: python -m unittest discover -s tests

      - name: 编译 Python
        run: |
          python -m compileall -q src tests
          sh -n scripts/memory-device-install.sh
