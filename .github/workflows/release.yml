name: 发布稳定版本

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: 验证并发布 ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 确认标签来自 main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: 安装发布依赖并运行全量测试
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[mcp,postgres,dev]"
          python -m unittest discover -s tests
          python -m compileall -q src tests
          sh -n scripts/memory-device-install.sh

      - name: 构建并校验发布资产
        run: |
          python scripts/build-wheel.py --outdir dist
          python scripts/build-release.py --tag "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY" --outdir dist
          cd dist
          sha256sum --check SHA256SUMS

      - name: 从发布 wheel 做干净安装冒烟
        run: |
          python -m venv release-smoke
          wheel_path="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          release-smoke/bin/python -m pip install "$wheel_path[mcp,postgres]"
          release-smoke/bin/memory-device --help
          release-smoke/bin/memory-gateway --help

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "${release_flags[@]}"
